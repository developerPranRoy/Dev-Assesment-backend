services:
  - type: web
    name: dev-assessment-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SERVICE_NAME
        value: all
      - key: DATABASE_URL
        fromDatabase:
          name: dev-assessment-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: dev-assessment-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dev-assessment-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "1000"
      - key: RATE_LIMIT_AUTH_MAX
        value: "20"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: CREDITS_PER_INVITATION
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: JUDGE0_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: worker
    name: dev-assessment-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: dev-assessment-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: dev-assessment-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dev-assessment-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: LOG_LEVEL
        value: info
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: dev-assessment-api
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: dev-assessment-api
          envVarKey: JWT_REFRESH_SECRET
      - key: JUDGE0_API_URL
        sync: false

  - type: redis
    name: dev-assessment-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: dev-assessment-db
    databaseName: dev_assessment_platform
    plan: free
    postgresMajorVersion: 16
