# ============================================================
#  nginx reverse-proxy — production configuration
#  Optimised for 1 M+ users / high-concurrency API traffic
# ============================================================

# ── Upstream pools with keepalive ────────────────────────────────────────────
upstream auth_upstream {
    least_conn;
    server auth:5000;
    keepalive 64;
}

upstream core_upstream {
    least_conn;
    server core:5000;
    keepalive 64;
}

upstream exam_upstream {
    least_conn;
    server exam:5000;
    keepalive 64;
}

upstream payment_upstream {
    least_conn;
    server payment:5000;
    keepalive 64;
}

# ── Rate-limit zones ─────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:20m     rate=120r/s;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook:5m  rate=5r/s;

# ── Response cache zone ───────────────────────────────────────────────────────
proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=10m
    use_temp_path=off;

# ── Main server block ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout          30s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain text/css;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "DENY"          always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Correlation ID ────────────────────────────────────────────────────────
    set $req_id $request_id;
    if ($http_x_request_id) { set $req_id $http_x_request_id; }
    add_header X-Request-Id $req_id always;

    # ── Shared proxy settings ─────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    X-Request-Id      $req_id;
    proxy_set_header    Connection        "";

    proxy_connect_timeout  5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;
    proxy_buffering         on;
    proxy_buffer_size       8k;
    proxy_buffers           8 16k;

    # ── Health / readiness ────────────────────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://core_upstream;
    }

    location = /ready {
        access_log off;
        proxy_pass http://core_upstream;
    }

    # ── Auth service  (must be listed before /api/v1/ catch-all) ─────────────
    location ^~ /api/v1/auth/ {
        limit_req zone=auth burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://auth_upstream;
    }

    # ── Stripe webhook — raw body, unbuffered ────────────────────────────────
    location = /api/v1/payments/webhook {
        limit_req zone=webhook burst=10 nodelay;
        limit_req_status 429;
        proxy_pass              http://payment_upstream;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      120s;
    }

    # ── Payment service ───────────────────────────────────────────────────────
    location ^~ /api/v1/payments/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://payment_upstream;
    }

    # ── Exam service — attempt start ─────────────────────────────────────────
    location ~ ^/api/v1/assessments/[^/]+/attempts {
        limit_req zone=api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://exam_upstream;
    }

    # ── Exam service — attempt management ────────────────────────────────────
    location ^~ /api/v1/attempts {
        limit_req zone=api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://exam_upstream;
    }

    # ── Exam service — submissions ────────────────────────────────────────────
    location ^~ /api/v1/submissions {
        limit_req zone=api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://exam_upstream;
    }

    # ── Core service (companies, problems, assessments, admin, invitations) ───
    # Cached GET responses for read-heavy endpoints
    location ^~ /api/v1/ {
        limit_req zone=api burst=120 nodelay;
        limit_req_status 429;

        proxy_cache              api_cache;
        proxy_cache_valid        200 10s;
        proxy_cache_methods      GET HEAD;
        proxy_cache_key          "$scheme$host$request_uri";
        proxy_cache_use_stale    error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://core_upstream;
    }

    # ── Catch-all ─────────────────────────────────────────────────────────────
    location / {
        default_type application/json;
        return 404 '{"success":false,"message":"Not found"}';
    }

    # ── Custom error pages ────────────────────────────────────────────────────
    error_page 429 @too_many;
    location @too_many {
        default_type application/json;
        return 429 '{"success":false,"message":"Too many requests"}';
    }

    error_page 502 503 504 @upstream_err;
    location @upstream_err {
        default_type application/json;
        return 503 '{"success":false,"message":"Service temporarily unavailable"}';
    }
}
